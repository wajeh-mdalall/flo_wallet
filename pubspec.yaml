name: flo_wallet
description: "Flo Wallet - A digital wallet application built with Flutter."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  firebase_auth: ^6.1.2
  firebase_core: ^4.2.1
  get_it: ^9.1.1
  internet_connection_checker: ^3.0.1
  flutter_bloc: ^9.1.1
  go_router: ^17.0.1
  intl_phone_number_input: ^0.7.5
  pinput: ^6.0.1
  cloud_firestore: ^6.1.2
  image_picker: ^1.2.2
  intl: ^0.20.2
  country_picker: ^2.0.27
  http: ^1.6.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_native_splash:
  color: "#3C69C9"
  image: assets/images/flo_wallet_logo.png
  android_12:
    image: assets/images/flo_wallet_logo.png
    color: "#3C69C9"
  fullscreen: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/images/flo_wallet_logo.png
  min_sdk_android: 21